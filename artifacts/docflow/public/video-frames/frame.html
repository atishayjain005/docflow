<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DocFlow Walkthrough Frame</title>
    <style>
      :root {
        color-scheme: light;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
        --ink: #102a2a;
        --teal: #27877f;
        --paper: #f7f3eb;
        --accent: #f4a340;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        overflow: hidden;
        background: var(--paper);
      }

      .stage {
        position: relative;
        width: 100vw;
        height: 100vh;
        display: grid;
        place-items: center;
      }

      .title,
      .outro {
        padding: 72px;
        text-align: center;
      }

      .title {
        background:
          radial-gradient(circle at 25% 20%, rgb(244 163 64 / 0.3), transparent 26rem),
          linear-gradient(135deg, #102a2a, #143f3c);
        color: white;
      }

      .eyebrow {
        color: var(--accent);
        font-size: 16px;
        font-weight: 800;
        letter-spacing: 0.24em;
        text-transform: uppercase;
      }

      h1 {
        margin: 18px auto 20px;
        max-width: 900px;
        font-size: clamp(56px, 8vw, 92px);
        line-height: 0.95;
        letter-spacing: -0.07em;
      }

      p {
        margin: 0 auto;
        max-width: 860px;
        color: rgb(255 255 255 / 0.82);
        font-size: clamp(24px, 3vw, 36px);
        line-height: 1.25;
      }

      .shot {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }

      .caption {
        position: absolute;
        left: 48px;
        right: 48px;
        bottom: 42px;
        border-radius: 22px;
        background: rgb(16 42 42 / 0.9);
        box-shadow: 0 24px 80px rgb(16 42 42 / 0.25);
        color: white;
        padding: 24px 30px;
      }

      .caption strong {
        display: block;
        margin-bottom: 6px;
        color: var(--accent);
        font-size: 15px;
        letter-spacing: 0.22em;
        text-transform: uppercase;
      }

      .caption span {
        display: block;
        font-size: clamp(24px, 3vw, 34px);
        font-weight: 760;
        letter-spacing: -0.035em;
      }

      .outro {
        background:
          radial-gradient(circle at 75% 20%, rgb(39 135 127 / 0.18), transparent 28rem),
          var(--paper);
        color: var(--ink);
      }

      .outro p {
        color: rgb(16 42 42 / 0.72);
      }

      .pill {
        display: inline-flex;
        margin-top: 36px;
        border-radius: 999px;
        background: var(--ink);
        color: white;
        padding: 14px 24px;
        font-size: 22px;
        font-weight: 750;
      }
    </style>
  </head>
  <body>
    <main id="stage" class="stage"></main>
    <script>
      const scenes = {
        title: {
          type: "title",
          eyebrow: "Fresh walkthrough",
          headline: "DocFlow product walkthrough",
          copy: "Collaborative documents, rich editing, imports, and sharing in one focused workspace.",
        },
        workspace: {
          type: "shot",
          image: "01-workspace.png",
          eyebrow: "Workspace",
          caption: "Start from seeded teammates, a document library, and quick activity stats.",
        },
        editor: {
          type: "shot",
          image: "02-editor.png",
          eyebrow: "Editor",
          caption: "Open a document, shape content with the rich toolbar, and save changes.",
        },
        share: {
          type: "shot",
          image: "03-share.png",
          eyebrow: "Sharing",
          caption: "Bring a teammate into the document with the owner-only share flow.",
        },
        outro: {
          type: "outro",
          eyebrow: "Submitted scope",
          headline: "Built, tested, and deployed",
          copy: "PostgreSQL + Drizzle API, generated hooks, smoke-tested flows, documented tradeoffs, and a live Vercel demo.",
          link: "docflow-xi-eight.vercel.app",
        },
      };

      const sceneName = new URLSearchParams(window.location.search).get("scene") || "title";
      const scene = scenes[sceneName] || scenes.title;
      const stage = document.getElementById("stage");

      if (scene.type === "shot") {
        stage.innerHTML = `
          <img class="shot" src="${scene.image}" alt="" />
          <div class="caption">
            <strong>${scene.eyebrow}</strong>
            <span>${scene.caption}</span>
          </div>
        `;
      } else {
        stage.classList.add(scene.type);
        stage.innerHTML = `
          <div>
            <div class="eyebrow">${scene.eyebrow}</div>
            <h1>${scene.headline}</h1>
            <p>${scene.copy}</p>
            ${scene.link ? `<div class="pill">${scene.link}</div>` : ""}
          </div>
        `;
      }
    </script>
  </body>
</html>
